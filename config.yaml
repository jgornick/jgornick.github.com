languageCode: "en-us"
baseURL: "https://joegornick.com/"
title: "Joe Gornick"
copyright: "Joe Gornick"

module:
  imports:
    - path: github.com/athul/archie

pagination:
  pagerSize: 10

summaryLength: 30
enableEmoji: true

markup:
  highlight:
    noClasses: false  # Use CSS classes for syntax highlighting
    lineNos: false
    lineNumbersInTable: false

permalinks:
  posts: /:year/:month/:day/:title/

params:
  mode: "dark"  # Force dark theme only
  useCDN: false
  subtitle: "Dad, Husband, Nerd from Minnesota"
  mathjax: false
  customcss:
    - "css/custom.css"
    - "css/syntax.css"

  social:
    - name: "GitHub"
      icon: "github"
      url: "https://github.com/jgornick"

    - name: "Instagram"
      icon: "instagram"
      url: "https://instagram.com/joe.gornick"

menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1

    - name: "All Posts"
      url: "/posts"
      weight: 2

    - name: "Tags"
      url: "/tags"
      weight: 3

