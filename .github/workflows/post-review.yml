# Reviews blog posts in a pull request before Joe merges it: links with
# lychee, facts and voice with Claude and Gemini. Two reviewers from different
# AI companies, because Claude helps draft the posts and would share its own
# blind spots. The result is one PR comment that each run edits in place.
# Advisory: a finding never fails a job, and nothing here blocks a merge.
#
# Runs when a PR that touches content/posts/ is opened (unless it's a draft),
# reopened, or marked ready for review. Not on every push. To review again
# after pushing fixes, convert the PR to a draft and mark it ready again, or:
#
#   gh workflow run post-review.yml -f pr=<number>
#
# Re-running a finished run from the Actions tab doesn't pick up new commits:
# a re-run reviews the commit its original event saw.
#
# Claude runs on Joe's Claude plan: the CLAUDE_CODE_OAUTH_TOKEN secret, made
# with `claude setup-token`. ANTHROPIC_API_KEY is the fallback, used only when
# that secret isn't set. Gemini runs on a Gemini API key from Google AI Studio
# (GEMINI_API_KEY) with billing on: the free tier gives the model the CLI uses
# 20 requests a day, fewer than one review takes. A reviewer whose secret
# isn't set is skipped, and the comment says so.
#
# Each reviewer job sees only its own credential, and its GitHub token is
# read-only. Only the report job can comment, and it never sees a key. Both
# reviewers return findings as JSON (.github/post-review/findings.schema.json),
# and .github/post-review/render.js merges them into the comment.
#
# Before making this a required status check: required checks attach to a
# PR's newest commit, and this workflow is path-filtered and skips plain
# pushes, so the check would sit at "Expected" on most commits and block the
# merge. It would first need a job that runs on every push and only calls
# the reviewers when posts changed.

name: Post review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths: ["content/posts/**"]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions: {}

env:
  CLAUDE_MODEL: claude-opus-5-5
  # With an API key, Gemini CLI 0.63 sends every Flash request to its newest
  # Flash whatever the flag says, so name the model that actually runs.
  GEMINI_MODEL: gemini-3.8-flash
  GEMINI_CLI_VERSION: 0.63.0

concurrency:
  group: post-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Find changed posts
    # `opened` fires for drafts too; a draft is reviewed when it's marked ready.
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      fork: ${{ steps.pr.outputs.fork }}
      has_claude: ${{ steps.pr.outputs.has_claude }}
      has_gemini: ${{ steps.pr.outputs.has_gemini }}
      posts: ${{ steps.posts.outputs.posts }}
      has_posts: ${{ steps.posts.outputs.has_posts }}
    steps:
      - name: Look up the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          # Only whether each is set. Pull requests from forks never get them.
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          [[ "$NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Not a pull request number: $NUMBER"; exit 1; }
          {
            gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json number,headRefOid,baseRefName,isCrossRepository \
              --jq '"number=\(.number)", "head_sha=\(.headRefOid)", "base_ref=\(.baseRefName)", "fork=\(.isCrossRepository)"'
            echo "has_claude=$HAS_CLAUDE"
            echo "has_gemini=$HAS_GEMINI"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: List new and edited posts
        id: posts
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          # A is new; M and R (renamed) are edited. A deleted post has nothing to review.
          changed=$(git diff --name-status -M --diff-filter=AMR "origin/${BASE_REF}...HEAD" -- 'content/posts/*.md' |
            awk -F'\t' '{ print substr($1, 1, 1) "\t" $NF }')
          posts=$(jq -R -s -c '
            split("\n") | map(select(length > 0) | split("\t")
              | { status: (if .[0] == "A" then "new" else "edited" end), path: .[1] })' <<<"$changed")

          # Only plain file names get through. They reach the reviewers'
          # prompts, and lychee-action evals its arguments.
          safe='^content/posts/[A-Za-z0-9._/-]+\.md$'
          odd=$(jq -r --arg re "$safe" '.[] | select(.path | test($re) | not) | .path' <<<"$posts")
          if [ -n "$odd" ]; then
            echo "::warning::Skipping posts with unusual file names; they're listed in this step's log."
            while IFS= read -r path; do printf '  %q\n' "$path"; done <<<"$odd"
          fi
          posts=$(jq -c --arg re "$safe" 'map(select(.path | test($re)))' <<<"$posts")

          jq -r '.[] | "\(.status)\t\(.path)"' <<<"$posts"
          echo "posts=$posts" >> "$GITHUB_OUTPUT"
          echo "has_posts=$(jq 'length > 0' <<<"$posts")" >> "$GITHUB_OUTPUT"

  links:
    name: Check links
    needs: changes
    if: needs.changes.outputs.has_posts == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.lychee.outputs.exit_code }}
      report: ${{ steps.collect.outputs.report }}
      frontmatter: ${{ steps.collect.outputs.frontmatter }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          persist-credentials: false

      - name: Check front matter
        env:
          POSTS: ${{ needs.changes.outputs.posts }}
        run: |
          mkdir -p .post-review
          jq -r '.[].path' <<<"$POSTS" > .post-review/link-inputs.txt
          : > .post-review/frontmatter.md
          while read -r post; do
            if [ "$(yq --front-matter=extract '.draft' "$post" </dev/null)" = true ]; then
              echo "- \`$post\` still says \`draft: true\`, so merging won't publish it." >> .post-review/frontmatter.md
            fi
            # lychee doesn't read front matter. Local images are served from
            # static/; remote ones go to lychee as an extra input.
            yq --front-matter=extract '[.cover, .images] | flatten | map(select(. != null and . != "")) | unique | .[]' "$post" </dev/null |
              while read -r ref; do
                case "$ref" in
                  http://*|https://*) echo "$ref" >> .post-review/frontmatter-urls.txt ;;
                  /*) [ -f "static$ref" ] || echo "- \`$post\` front matter points at \`$ref\`, which isn't in \`static/\`." >> .post-review/frontmatter.md ;;
                esac
              done
          done < .post-review/link-inputs.txt
          if [ -s .post-review/frontmatter-urls.txt ]; then
            echo .post-review/frontmatter-urls.txt >> .post-review/link-inputs.txt
          fi

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --root-dir resolves /media/... links against static/. Instagram,
          # LinkedIn, Unsplash and X turn away automated requests (Unsplash
          # with a 401), so lychee skips them rather than reporting them
          # broken every time.
          args: >-
            --no-progress
            --files-from .post-review/link-inputs.txt
            --root-dir ${{ github.workspace }}/static
            --accept 200..=299,429
            --max-retries 2
            --exclude '^https?://([a-z0-9-]+\.)?(instagram|linkedin|twitter|unsplash|x)\.com/'
          format: markdown
          output: .post-review/links.md
          fail: false
          failIfEmpty: false

      - name: Hand the results to the report job
        id: collect
        if: always()
        run: |
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "report<<$delim"
            printf '%s\n' "$(cat .post-review/links.md 2>/dev/null)"
            echo "$delim"
            echo "frontmatter<<$delim"
            printf '%s\n' "$(cat .post-review/frontmatter.md 2>/dev/null)"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  review-claude:
    name: Review with Claude
    needs: changes
    if: needs.changes.outputs.has_posts == 'true' && needs.changes.outputs.has_claude == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      findings: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Joe's writing-style skill, the same one he drafts with.
      - name: Check out the voice guide
        uses: actions/checkout@v7
        with:
          repository: jgornick/skills
          path: .post-review/skills
          sparse-checkout: my-writing-style
          persist-credentials: false

      - name: Prepare the review
        id: inputs
        env:
          POSTS: ${{ needs.changes.outputs.posts }}
          BASE_REF: ${{ needs.changes.outputs.base_ref }}
        run: |
          bash .github/post-review/prepare.sh

          # claude_args wraps the schema in single quotes.
          schema=$(jq -c . .github/post-review/findings.schema.json)
          if [[ "$schema" == *"'"* ]]; then
            echo "::error::findings.schema.json can't contain a single quote."
            exit 1
          fi
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "schema=$schema"
            echo "prompt<<$delim"
            printf '%s\n' "$(cat .github/post-review/prompt.md)"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Review with Claude
        id: claude
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.244
        with:
          # The Claude plan first; the API key only when there's no plan token,
          # so the two never compete.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          # The workflow's own read-only token. Without this the action wants
          # the Claude GitHub App, which this repo doesn't use.
          github_token: ${{ github.token }}
          prompt: ${{ steps.inputs.outputs.prompt }}
          # The action's defaults include editing files; this job only reads
          # and searches. The deny rules keep Read away from the token the
          # action writes into .git/config and from the process environment,
          # which holds the Claude credential.
          claude_args: >-
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 60
            --allowedTools Read,Glob,Grep,WebSearch,WebFetch
            --disallowedTools Bash,Edit,MultiEdit,Write,NotebookEdit
            --json-schema '${{ steps.inputs.outputs.schema }}'
          settings: |
            {"permissions": {"deny": ["Read(./.git/**)", "Read(//proc/**)"]}}

  review-gemini:
    name: Review with Gemini
    needs: changes
    if: needs.changes.outputs.has_posts == 'true' && needs.changes.outputs.has_gemini == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.findings.outputs.findings }}
      error: ${{ steps.findings.outputs.error }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the voice guide
        uses: actions/checkout@v7
        with:
          repository: jgornick/skills
          path: .post-review/skills
          sparse-checkout: my-writing-style
          persist-credentials: false

      - name: Prepare the review
        env:
          POSTS: ${{ needs.changes.outputs.posts }}
          BASE_REF: ${{ needs.changes.outputs.base_ref }}
        run: bash .github/post-review/prepare.sh

      # Gemini CLI won't run headless in a folder it doesn't trust, and once it
      # trusts one it loads that folder's hooks, MCP servers and settings. So
      # it gets a folder of its own holding only Markdown (the posts, the
      # review inputs and the voice guide), where nothing a pull request adds
      # can configure it. Gemini has no structured output setting, so the
      # prompt carries the schema and asks for bare JSON.
      - name: Stage a clean folder for Gemini
        run: |
          dir="$RUNNER_TEMP/review"
          mkdir -p "$dir"
          find content/posts .post-review -type f -name '*.md' -not -name 'GEMINI.md' -print0 |
            xargs -0 cp --parents -t "$dir"
          cp .post-review/changes.diff "$dir/.post-review/"
          echo "REVIEW_DIR=$dir" >> "$GITHUB_ENV"

          {
            cat .github/post-review/prompt.md
            echo
            echo "Structured output here means your final reply: one JSON object and nothing else, with no code fence and no text around it, matching this JSON Schema:"
            echo
            jq -c . .github/post-review/findings.schema.json
          } > "$RUNNER_TEMP/gemini-prompt.md"

      # Settings and policy live in the home folder, which the pull request
      # can't touch. The policy denies the shell and file writes, and allows
      # web search and fetch, which would otherwise ask for approval and so be
      # refused in headless mode.
      - name: Configure Gemini CLI
        run: |
          mkdir -p ~/.gemini/policies
          cat > ~/.gemini/settings.json <<'EOF'
          {
            "general": { "enableAutoUpdate": false },
            "privacy": { "usageStatisticsEnabled": false },
            "model": { "maxSessionTurns": 60 }
          }
          EOF
          cat > ~/.gemini/policies/post-review.toml <<'EOF'
          [[rule]]
          toolName = ["run_shell_command", "write_file", "replace"]
          decision = "deny"
          priority = 900

          [[rule]]
          toolName = ["google_web_search", "web_fetch"]
          decision = "allow"
          priority = 800
          EOF

      - name: Review with Gemini
        id: gemini
        continue-on-error: true
        # A healthy run takes a few minutes. An overloaded model means long
        # retries, and an open Gemini CLI bug can leave web search hanging,
        # so cap it: the comment waits for every reviewer.
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$REVIEW_DIR"
          set +e
          # A fatal error (a used-up quota, say) goes to stderr as JSON, so
          # keep a copy for the next step as well as the log.
          npx --yes "@google/gemini-cli@${GEMINI_CLI_VERSION}" \
            --skip-trust --model "$GEMINI_MODEL" --output-format json \
            --prompt "$(cat "$RUNNER_TEMP/gemini-prompt.md")" \
            > "$RUNNER_TEMP/gemini-output.json" 2> >(tee "$RUNNER_TEMP/gemini-stderr.log" >&2)
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Check Gemini's findings
        id: findings
        if: always()
        env:
          EXIT_CODE: ${{ steps.gemini.outputs.exit_code }}
        run: |
          delim="EOF_$(openssl rand -hex 8)"
          if findings=$(node .github/post-review/extract-findings.js "$RUNNER_TEMP/gemini-output.json" "$RUNNER_TEMP/gemini-stderr.log" 2> "$RUNNER_TEMP/extract-error.txt"); then
            { echo "findings<<$delim"; echo "$findings"; echo "$delim"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # One line, so text from the model can't start a workflow command.
          # No exit code means the step was killed before it could record one,
          # which is what its timeout does.
          if [ -z "$EXIT_CODE" ]; then
            error="it didn't finish within 10 minutes"
          elif [ "$EXIT_CODE" = 53 ]; then
            error="it ran out of turns before finishing"
          else
            error=$(tr -s '\n' ' ' < "$RUNNER_TEMP/extract-error.txt" | head -c 300 | sed 's/ *$//')
          fi
          echo "::error::Gemini returned no usable findings: $error"
          { echo "error<<$delim"; echo "$error"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          exit 1

  report:
    name: Comment on the pull request
    needs: [changes, links, review-claude, review-gemini]
    # Runs when links or a review fail too, so the comment says what broke.
    # Not after a cancel, though: a newer run is already on its way.
    if: ${{ !cancelled() && needs.changes.outputs.has_posts == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          sparse-checkout: .github/post-review
          persist-credentials: false

      - name: Write the comment
        uses: actions/github-script@v9
        env:
          PR: ${{ needs.changes.outputs.pr }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
          POSTS: ${{ needs.changes.outputs.posts }}
          FORK: ${{ needs.changes.outputs.fork }}
          CLAUDE_ENABLED: ${{ needs.changes.outputs.has_claude }}
          CLAUDE_RESULT: ${{ needs.review-claude.result }}
          CLAUDE_FINDINGS: ${{ needs.review-claude.outputs.findings }}
          GEMINI_ENABLED: ${{ needs.changes.outputs.has_gemini }}
          GEMINI_RESULT: ${{ needs.review-gemini.result }}
          GEMINI_FINDINGS: ${{ needs.review-gemini.outputs.findings }}
          GEMINI_ERROR: ${{ needs.review-gemini.outputs.error }}
          LINKS_RESULT: ${{ needs.links.result }}
          LINKS_EXIT: ${{ needs.links.outputs.exit_code }}
          LINKS_REPORT: ${{ needs.links.outputs.report }}
          FRONTMATTER: ${{ needs.links.outputs.frontmatter }}
        with:
          script: |
            const { MARKER, render } = require('./.github/post-review/render.js');
            const { owner, repo } = context.repo;
            const env = process.env;
            // One line per reviewer below. Adding one (say, Ollama or OpenAI)
            // means a review job like review-gemini, its env above, and a line
            // here with its own marker.
            const reviewer = (marker, name, prefix, model, secret) => ({
              marker,
              name,
              model,
              secret,
              skipped: env.FORK === 'true' ? 'fork' : env[`${prefix}_ENABLED`] !== 'true' ? 'no-credentials' : '',
              result: env[`${prefix}_RESULT`],
              findings: env[`${prefix}_FINDINGS`],
              error: env[`${prefix}_ERROR`],
            });

            const body = render({
              repo: `${owner}/${repo}`,
              pr: env.PR,
              headSha: env.HEAD_SHA,
              runUrl: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              posts: JSON.parse(env.POSTS),
              links: { result: env.LINKS_RESULT, exitCode: env.LINKS_EXIT, report: env.LINKS_REPORT, frontmatter: env.FRONTMATTER },
              reviewers: [
                reviewer('🟣', 'Claude', 'CLAUDE', env.CLAUDE_MODEL, '`CLAUDE_CODE_OAUTH_TOKEN` or `ANTHROPIC_API_KEY`'),
                reviewer('🔵', 'Gemini', 'GEMINI', env.GEMINI_MODEL, '`GEMINI_API_KEY`'),
              ],
            });
            await core.summary.addRaw(body).write();

            // A fork's pull_request token is read-only whatever this job asks for.
            if (env.FORK === 'true') {
              core.notice('Pull request from a fork: the review is in this job summary instead of a comment.');
              return;
            }

            const issue_number = Number(env.PR);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
