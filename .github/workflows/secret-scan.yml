# Scans the repo's full git history for secrets with betterleaks, the same
# scan lefthook's pre-push hook runs locally (see lefthook.yml). Running it on
# GitHub covers the commits that never pass through a local hook: ones made in
# the github.com editor, and review suggestions accepted in a pull request.
#
# It runs on every pull request with no path filter, so it can safely become a
# required status check. It can't keep a secret private, though: by the time
# it runs, the branch is already pushed to this public repo. GitHub push
# protection, on for this repo, stops a push before that, but only for the
# secret types GitHub recognizes; this catches the rest before they merge.
#
# Pinned to ubuntu-26.04 like deploy.yml, so runner upgrades arrive in a PR.
#
# Allowlists live in .betterleaks.toml, shared with the local hooks.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      # Bump both together; the hash is the linux_x64 line of the release's
      # checksums.txt. Matches the version the local hooks use (Homebrew).
      BETTERLEAKS_VERSION: 1.9.0
      BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install betterleaks
        run: |
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/betterleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/betterleaks"
          echo "$RUNNER_TEMP/betterleaks" >> "$GITHUB_PATH"

      # Full history rather than the PR's commits, like the pre-push hook: a
      # secret that got in some other way is still caught on the next PR.
      - name: Scan the full history
        run: betterleaks git --redact --no-banner --no-color .
