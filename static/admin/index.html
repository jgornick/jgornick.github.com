<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
</head>
<body>
  <!--
    Decap CMS, pinned to an exact version with an integrity hash.

    This was `decap-cms@^3.3.3`. unpkg resolves the caret at page load, not at
    build time, so the admin UI had silently ridden from 3.3.3 to 3.16.1 across
    13 minor releases nobody reviewed, and `max-age=60` gave no real buffer if
    unpkg went down.

    The exact-version URL behaves far better than the range did: it returns 200
    directly instead of a 302, and `max-age=31536000` (a year, immutable) rather
    than 60 seconds. `integrity` + `crossorigin` mean the browser refuses the
    file outright if unpkg ever serves different bytes.

    To upgrade, bump the version and recompute the hash together — they must
    change in the same edit or the CMS will not load:

      V=3.x.y
      curl -sL "https://unpkg.com/decap-cms@$V/dist/decap-cms.js" \
        | openssl dgst -sha384 -binary | openssl base64 -A

    Then load /admin/ and confirm the login screen renders before pushing.
    See CUSTOMIZATIONS.md § Decap CMS.
  -->
  <script
    src="https://unpkg.com/decap-cms@3.16.1/dist/decap-cms.js"
    integrity="sha384-hhTu9Y4nUnpebdUoT0bRx5lciIW+n97A7RrydmU92mb8EJj2YfInMzFkP2maNZS+"
    crossorigin="anonymous"
  ></script>
</body>
</html>
