baseURL: https://joegornick.com/
languageCode: en-us
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
title: Joe Gornick
copyright: Joe Gornick

hasCJKLanguage: false
enableEmoji: true

# Main sections for search and recent posts
mainSections: ["posts"]

permalinks:
  posts: /:year/:month/:day/:title/

pagination:
  pagerSize: 10
  path: "page"

taxonomies:
  tag: tags

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      extras:
        delete:
          enable: true
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: false
        superscript:
          enable: false
      strikethrough: true
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    lineNumbersInTable: false
    noClasses: false
    style: catppuccin-frappe
    tabWidth: 2

outputs:
  home: ["HTML", "RSS", "JSON", "WebAppManifest"]

outputFormats:
  WebAppManifest:
    mediaType: "application/manifest+json"
    baseName: "site"
    isPlainText: true

module:
  hugoVersion:
    extended: true
    min: 0.146.0
  imports:
    - path: github.com/tom2almighty/hugo-narrow
