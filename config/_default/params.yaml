# Basic site info with SEO
description: "Dad, Husband, Nerd from Minnesota"
keywords: ["Tech", "Blog", "Programming", "Software Engineering"]
defaultAuthor: "Joe Gornick"
language: "en-US"
shortName: "Joe Gornick"
images:
  - "/images/og-default.jpg"

# Favicon
favicon:
  svg: "/favicon.svg"

# Author info
author:
  name: "Joe Gornick"
  title: "Dad, Husband, Nerd from Minnesota"
  description: ""
  avatar: "/img/avatar-square.jpeg"
  social:
    - name: "GitHub"
      url: "https://github.com/jgornick"
      icon: "github"
    - name: "Instagram"
      url: "https://instagram.com/joe.gornick"
      icon: "instagram"

# Header configuration
header:
  sticky: true
  logo:
    image: "/img/logo.svg"
    link: "/"
  showThemeSwitch: false
  showDarkModeSwitch: false
  showLanguageSwitch: false
  languageSwitchMode: "dropdown"

# Dock display mode
dock: undefined

# Content width
contentWidth: "56rem"

# TOC (Table of Contents)
toc:
  enabled: true
  position: "card"
  maxHeight: "80vh"

# Default color scheme - using Minnesota State Flag palette (4 variants)
# Analogous to Catppuccin's 4 flavors: light → twilight → dusk → darkest
#   mn-lake-superior   = Latte     (light, sun on open water)
#   mn-boundary-waters = Frappé    (twilight, BWCA at dusk)
#   mn-north-shore     = Macchiato (dusk, North Shore at nightfall)
#   mn-night-sky       = Mocha     (dark, the flag's own Night Sky Blue field)
colorScheme: "mn-boundary-waters"
themes:
  mn-lake-superior:
    name: "Lake Superior"
    order: 1
  mn-boundary-waters:
    name: "Boundary Waters"
    order: 2
  mn-north-shore:
    name: "North Shore"
    order: 3
  mn-night-sky:
    name: "Night Sky"
    order: 4

# Home page configuration
home:
  recentPostsCount: 3
  contentOrder:
    - author-section
    - recent-posts

# Post configuration
post:
  showRelated: false
  relatedPostsCount: 3
  license:
    show: false

# Comments
comments:
  enabled: false

# Analytics
analytics:
  enabled: true
  google:
    enabled: true
    id: "G-CYCL78ZG85"

# KaTeX
katex:
  enabled: false

# Mermaid
mermaid:
  enabled: false

# GLightbox
lightbox:
  enabled: false

# Code block
codeblock:
  collapse:
    enabled: false
    defaultState: expanded
    autoCollapseLines: 30
    autoCollapseHeight: 400
    collapsedHeight: 120

# Reading progress
readingProgress:
  enabled: false
  height: 3
  showOnHomepage: false
  smoothScroll: true
  hideOnComplete: false
