# Git hooks, managed by lefthook (https://lefthook.dev).
#
# Install once per clone:  npm run hooks
# Both binaries come from Homebrew:  brew install lefthook betterleaks
#
# Skip in an emergency with LEFTHOOK=0 git commit ... , but prefer fixing the
# finding.
#
# Allowlists live in .betterleaks.toml, which betterleaks picks up on its own.
#
# What these hooks do NOT cover, so nobody mistakes them for a perimeter:
#
#   1. Renames. lefthook skips a hook outright when the push or staged range
#      has no file diff — it prints "no matching push files" — and a
#      rename-only commit lands in that bucket. Verified against v2.1.12; no
#      config key changes it (`skip_empty` is silently dropped, and a `files:`
#      override at either job or hook level does not help, because the check
#      runs first). Harmless in practice: a rename moves a blob that was
#      already scanned when it was added, so no new content reaches the remote.
#      Worth knowing only because a skipped scan still prints in green.
#
#   2. `--no-verify`, which bypasses both hooks by design. GitHub push
#      protection still sees the push (see 3).
#
#   3. Anything written on github.com — the web editor, or a suggestion
#      accepted in a PR review. Those commits are made on GitHub's side and
#      never touch a local hook. GitHub push protection, on since 2026-10-06,
#      scans them server-side, but only for secret types GitHub recognizes,
#      which is a narrower set than betterleaks checks. A betterleaks step in
#      a workflow would close the rest.

pre-commit:
  jobs:
    - name: secrets
      run: betterleaks git --staged --redact --no-banner

pre-push:
  jobs:
    # ~0.2s over the whole repo. Full history rather than the push range, so a
    # commit that got in via an amend or an earlier bypass is still caught the
    # next time anything is pushed.
    - name: secrets-history
      run: betterleaks git --redact --no-banner
